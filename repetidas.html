<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Figurinhas Repetidas</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --green: #22c55e;
            --yellow: #facc15;
        }

       body {
    background: var(--bg);
    color: white;
    padding: 20px;
    min-height: 100vh;
}

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--yellow);
            font-size: 25px;
        }

        .acoes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-share {
            background: #3b82f6;
            color: white;
        }

        .selecoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--yellow);
        }

        .figurinhas {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .figurinha {
            height: 55px;
            border-radius: 10px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            font-weight: bold;
        }

        .figurinha:hover {
            transform: scale(1.05);
        }

        .figurinha.ativa {
            background: var(--green);
            color: black;
        }

    

       .busca-container {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding-top: 10px;
    padding-bottom: 15px;
    z-index: 9999;
    margin-bottom: 20px;
}

.busca-container input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
        }

        .topo-app {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 15px;
}

.topo-app h1 {
    margin: 0;
    flex: 1;
}

.btn-share-topo {

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: 0.2s;
}

.btn-share-topo img {

    width: 24px;
    height: 24px;

    object-fit: contain;

    opacity: 0.9;

    transition: 0.2s;
}

.btn-share-topo:hover img {
    opacity: 1;
    transform: scale(1.08);
}

.btn-collapse {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: white;

    width: 34px;
    height: 34px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 18px;

    transition: 0.2s;
}

.btn-collapse:hover {
    background: rgba(255,255,255,0.12);
    transform: scale(1.05);
}

.card.collapsed .figurinhas {
    display: none;
}

.topo-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.topo-card h2 {
    margin: 0;
    flex: 1;
}

        .painel-total {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    margin-bottom: 20px;
}

.painel-total p {
    opacity: 0.8;
    margin-bottom: 5px;
}

.painel-total h2 {
    color: var(--green);
    font-size: 32px;
}
    </style>
</head>

<body>

   <div class="topo-app">

    <h1>♻️ Figurinhas Repetidas</h1>

    <button
    class="btn-share-topo"
    onclick="compartilhar()"
    title="Compartilhar"
>
    <img src="share.png" alt="Compartilhar">
</button>

</div>
    <div class="busca-container">
    <input
        type="text"
        id="busca"
        placeholder="Buscar seleção..."
        oninput="filtrarSelecoes()"
    >
</div>
<div class="painel-total">
    <p>Total de Repetidas</p>
    <h2 id="totalRepetidas">0</h2>
</div>
    <div class="selecoes" id="selecoes"></div>

    <script>

        const selecoes = [
            "México - MEX",
            "África do Sul - RSA",
            "Coreia do Sul - KOR",
            "República Tcheca - CZE",
            "Canadá - CAN",
            "Bósnia e Herzegovina - BIH",
            "Catar - QAT",
            "Suíça - SUI",
            "Brasil - BRA",
            "Marrocos - MAR",
            "Haiti - HAI",
            "Escócia - SCO",
            "Estados Unidos - USA",
            "Paraguai - PAR",
            "Austrália - AUS",
            "Turquia - TUR",
            "Alemanha - GER",
            "Curaçao - CUW",
            "Costa do Marfim - CIV",
            "Equador - ECU",
            "Holanda - NED",
            "Japão - JPN",
            "Suécia - SWE",
            "Tunísia - TUN",
            "Bélgica - BEL",
            "Egito - EGY",
            "Irã - IRN",
            "Nova Zelândia - NZL",
            "Espanha - ESP",
            "Cabo Verde - CPV",
            "Arábia Saudita - KSA",
            "Uruguai - URU",
            "França - FRA",
            "Senegal - SEN",
            "Iraque - IRQ",
            "Noruega - NOR",
            "Argentina - ARG",
            "Argélia - ALG",
            "Áustria - AUT",
            "Jordânia - JOR",
            "Portugal - POR",
            "RD Congo - COD",
            "Uzbequistão - UZB",
            "Colômbia - COL",
            "Inglaterra - ENG",
            "Croácia - CRO",
            "Gana - GHA",
            "Panamá - PAN"
        ];

        const TOTAL_POR_SELECAO = 20;

        const especiais = {

            "Coca-Cola": [
                "CC1", "CC2", "CC3", "CC4", "CC5", "CC6", "CC7",
                "CC8", "CC9", "CC10", "CC11", "CC12", "CC13", "CC14"
            ],

            "FWC": [
                "FWC1", "FWC2", "FWC3", "FWC4",
                "FWC5", "FWC6", "FWC7", "FWC8",
                "FWC9", "FWC10", "FWC11", "FWC12",
                "FWC13", "FWC14", "FWC15", "FWC16",
                "FWC17", "FWC18", "FWC19"
            ],

            "Extra": [
                "00"
            ]
        };

        let estadoCollapse =
    JSON.parse(localStorage.getItem("collapseRepetidas"))
    || {};

        let repetidas =
            JSON.parse(localStorage.getItem("repetidasCopa"))
            || {};

       function iniciar() {

    selecoes.forEach(selecao => {

        if (!repetidas[selecao]) {

            repetidas[selecao] = [];

            for (let i = 1; i <= TOTAL_POR_SELECAO; i++) {

                repetidas[selecao].push({
                    numero: i,
                    possui: false
                });
            }
        }
    });

    Object.keys(especiais).forEach(grupo => {

        if (!repetidas[grupo]) {

            repetidas[grupo] = [];

            especiais[grupo].forEach(fig => {

                repetidas[grupo].push({
                    numero: fig,
                    possui: false
                });

            });
        }
    });
}

        function salvarCollapse() {

    localStorage.setItem(
        "collapseRepetidas",
        JSON.stringify(estadoCollapse)
    );
}

function toggleCollapse(selecao) {

    estadoCollapse[selecao] =
        !estadoCollapse[selecao];

    salvarCollapse();

    renderizar();
}

        function salvar() {

            localStorage.setItem(
                "repetidasCopa",
                JSON.stringify(repetidas)
            );
        }

        function atualizarTotalRepetidas() {

    let total = 0;

    Object.keys(repetidas).forEach(selecao => {

        total += repetidas[selecao]
            .filter(f => f.possui)
            .length;

    });

    document.getElementById("totalRepetidas").innerText = total;
}

      function renderizar() {

    atualizarTotalRepetidas();

    const container = document.getElementById("selecoes");
    container.innerHTML = "";

    selecoes.forEach(selecao => {
        container.appendChild(criarCard(selecao));
    });

    Object.keys(especiais).forEach(grupo => {
        container.appendChild(criarCard(grupo, true));
    });
}

function criarCard(selecao, especial = false) {

    const card = document.createElement("div");
    card.className = "card";

    if (estadoCollapse[selecao]) {
        card.classList.add("collapsed");
    }

    const dados = repetidas[selecao] || [];

    card.innerHTML = `
        <div class="topo-card">

            <h2>
                ${selecao}
                ${especial ? "⭐" : ""}
            </h2>

            <button
                class="btn-collapse"
                onclick="toggleCollapse('${selecao}')"
            >
                ☰
            </button>

        </div>

        <div class="figurinhas">
            ${dados.map((f, index) => `
                <div
                    class="figurinha ${f.possui ? "ativa" : ""}"
                    onclick="toggle('${selecao}', ${index})"
                >
                    ${f.numero}
                </div>
            `).join("")}
        </div>
    `;

    return card;
}

    
        function toggle(selecao, index) {

    const scrollY = window.scrollY;

    const item = repetidas[selecao][index];

    item.possui = !item.possui;

    if ("vibrate" in navigator) {
        if (item.possui) {
            navigator.vibrate(40);
        } else {
            navigator.vibrate([80, 30, 80]);
        }
    }

    salvar();
    renderizar();

    window.scrollTo(0, scrollY);
}

        async function compartilhar() {

            let texto =
                "FIGURINHAS REPETIDAS\n\n";

            Object.keys(repetidas).forEach(selecao => {

                const figs =
                    repetidas[selecao]
                        .filter(f => f.possui)
                        .map(f => f.numero);

                if (figs.length > 0) {

                    texto += `${selecao}\n`;
                    texto += figs.join(", ");
                    texto += "\n\n";
                }
            });

            if (navigator.share) {

                try {

                    await navigator.share({
                        title: "Figurinhas Repetidas",
                        text: texto
                    });

                } catch (e) {
                    console.log(e);
                }

            } else {

                navigator.clipboard.writeText(texto);

                alert("Texto copiado!");
            }
        }

        iniciar();

        renderizar();


          function removerAcentos(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function filtrarSelecoes() {

    const termo =
        removerAcentos(
            document.getElementById("busca").value
        );

    const cards =
        document.querySelectorAll(".card");

    cards.forEach(card => {

        const titulo =
            removerAcentos(
                card.querySelector("h2").innerText
            );

        card.style.display =
            titulo.includes(termo)
                ? "block"
                : "none";
    });
}

    </script>

</body>

</html>
